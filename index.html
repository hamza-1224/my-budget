<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script>/* iPhone/iPad: stop the automatic zoom when a box is tapped. Pinch-to-zoom still works there. */(function(){var u=navigator.userAgent,ios=/iP(hone|ad|od)/.test(u)||(/Macintosh/.test(u)&&navigator.maxTouchPoints>1);if(ios){var m=document.querySelector('meta[name=viewport]');m.setAttribute("content",m.getAttribute("content")+",maximum-scale=1")}})();</script>
<title>My Budget</title>
<meta name="description" content="Personal budget, accounts, plans and splits.">
<meta name="theme-color" content="#F3F4F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1015" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="My Budget">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* Layout: one calm phone-width column; accounts and net worth first, spending detail below; tab bar at the bottom like a native finance app. */
:root{
  --bg:#F3F4F7; --surface:#FFFFFF; --surface-2:#F8F9FB; --ink:#14171F; --muted:#666D7C; --faint:#9AA0AD; --line:#E2E5EB;
  --accent:#2747C9; --accent-ink:#FFFFFF; --accent-soft:#E8ECFB;
  --good:#1E7A4C; --good-soft:#E3F3EA; --warn:#A8670F; --warn-soft:#FBF0DC; --crit:#C23A28; --crit-soft:#FBE6E2;
  --shadow:0 1px 2px rgba(20,23,31,.04),0 4px 16px rgba(20,23,31,.05);
  --font-display:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-body:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1015; --surface:#171A21; --surface-2:#1D2129; --ink:#ECEEF3; --muted:#9BA1AE; --faint:#6D7381; --line:#2A2F39;
  --accent:#8EA4FF; --accent-ink:#0B1030; --accent-soft:#1E2544;
  --good:#5CCB91; --good-soft:#15291F; --warn:#E5AE52; --warn-soft:#2E2414; --crit:#F2735F; --crit-soft:#33191A;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1015; --surface:#171A21; --surface-2:#1D2129; --ink:#ECEEF3; --muted:#9BA1AE; --faint:#6D7381; --line:#2A2F39;
  --accent:#8EA4FF; --accent-ink:#0B1030; --accent-soft:#1E2544;
  --good:#5CCB91; --good-soft:#15291F; --warn:#E5AE52; --warn-soft:#2E2414; --crit:#F2735F; --crit-soft:#33191A;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-family:var(--font-display);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

.wrap{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(150px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.brand{font-family:var(--font-display);font-weight:800;font-size:17px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand-mark{width:22px;height:22px;border-radius:7px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-size:12px;font-weight:800}
.top-date{color:var(--muted);font-size:13px}
.beta{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 7px}

.view{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-t{font-family:var(--font-display);font-weight:700;font-size:15px;margin:0}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;font-size:13.5px}
.h-view{font-family:var(--font-display);font-size:22px;margin:4px 0 0;font-weight:800}

/* command bar */
.cmd{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 6px 6px 14px;box-shadow:var(--shadow)}
.cmd:focus-within{border-color:var(--accent)}
.cmd input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:15px;padding:8px 0}
.cmd button{border:0;border-radius:10px;padding:9px 14px;font-weight:700;font-family:var(--font-display);font-size:14px;background:var(--accent);color:var(--accent-ink);white-space:nowrap}
.cmd button.stop{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.cmd-hint{font-size:12.5px;color:var(--muted);margin:6px 2px 0}
.answer{background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-size:14.5px;display:flex;gap:10px;align-items:flex-start}
.answer p{margin:0;flex:1;white-space:pre-wrap}
.answer .x{flex:none}

/* net worth */
.nw-amt{font-size:34px;font-weight:800;line-height:1.1;margin:4px 0 2px}
.accts{display:flex;flex-direction:column;margin-top:12px}
.acct{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.acct-ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.acct-ic svg{width:18px;height:18px}
.acct-btn{width:100%;background:none;border:0;border-top:1px solid var(--line);text-align:left;color:inherit;font:inherit;cursor:pointer}
.acct-btn:hover .acct-n{color:var(--accent)}
.acct-n{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct-k{font-size:12.5px;color:var(--muted)}
.acct-b{text-align:right;font-weight:700;font-size:15px}
.acct-b small{display:block;font-family:var(--font-body);font-weight:500;font-size:11.5px;color:var(--muted);letter-spacing:0}
.neg{color:var(--crit)}

/* hero */
.hero-amt{font-size:34px;font-weight:800;line-height:1.05;margin:6px 0 4px}
.hero-sub{color:var(--muted);font-size:14px}
.bar{position:relative;height:8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);margin-top:14px}
.bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--accent);display:block}
.bar>i.warn{background:var(--warn)} .bar>i.crit{background:var(--crit)}
.bar .pace{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.55;border-radius:2px}
.bar.thin{height:6px;margin-top:8px}
.hero-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.hero-scale{display:flex;justify-content:space-between;gap:10px;margin-top:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.hero-scale b{color:var(--ink);font-weight:700}
.aside-h{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:14px 0 4px;border-top:1px solid var(--line)}
.acct.dim .acct-n,.acct.dim .acct-b{color:var(--muted)}
.acc{border-top:1px solid var(--line)}
.acc-sum{display:grid;grid-template-columns:36px minmax(0,1fr) auto 18px;gap:12px;align-items:center;width:100%;padding:12px 0;border:0;background:none;text-align:left}
.chev{width:18px;height:18px;color:var(--faint);transition:transform .15s}
.acc.open .chev{transform:rotate(180deg)}
.acc .ae{border-top:0;padding:2px 0 16px}
.tag{font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);margin-left:6px;white-space:nowrap}
.sw-row{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px;font-weight:600;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.sw-row small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.switch{width:48px;height:28px;border-radius:99px;border:0;background:var(--faint);position:relative;flex:none;padding:0}
.switch span{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s}
.switch[aria-checked="true"]{background:var(--good)}
.switch[aria-checked="true"] span{left:23px}
@media (prefers-reduced-motion:reduce){.chev,.switch span{transition:none}}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.stat b{display:block;font-size:18px;font-weight:700;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat small{display:block;color:var(--muted);font-size:12px;margin-top:2px}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.crit{background:var(--crit-soft);color:var(--crit)} .pill.none{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}

.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:5px 11px;border-radius:7px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg.full{display:grid;width:100%}
.seg.full button{padding:8px 6px}

.split{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:center}
.donut{width:150px;height:150px;max-width:100%}
.legend{display:flex;flex-direction:column;gap:8px;min-width:0}
.lg{display:grid;grid-template-columns:10px 1fr auto;gap:9px;align-items:center;font-size:13.5px;min-width:0}
.lg .dot{width:10px;height:10px;border-radius:3px}
.lg span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg em{font-style:normal;color:var(--muted);font-size:12.5px}

.brows{display:flex;flex-direction:column;gap:14px}
.brow-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.brow-name{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;min-width:0}
.brow-name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow-amt{font-size:13px;color:var(--muted);white-space:nowrap}
.brow-amt b{color:var(--ink);font-weight:700}
.brow-meta{display:flex;justify-content:space-between;margin-top:6px;font-size:12px;color:var(--muted)}
.sw{width:9px;height:9px;border-radius:3px;flex:none;display:inline-block}

.tx-list{display:flex;flex-direction:column}
.tx{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;padding:10px 4px;border:0;background:none;text-align:left;width:100%;border-radius:10px}
.tx:hover{background:var(--surface-2)}
.tx+.tx{border-top:1px solid var(--line);border-radius:0}
.badge{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:14px;color:#fff}
.badge.tr{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.badge svg{width:18px;height:18px}
.badge.emoji{font-size:19px;line-height:1}
.emo{width:36px;height:36px;border-radius:9px;border:1px dashed var(--faint);background:var(--surface-2);display:grid;place-items:center;font-size:19px;line-height:1;flex:none;padding:0}
.emo.has{border:1px solid var(--line)}
.emogrid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.emogrid button{aspect-ratio:1;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;font-size:21px;line-height:1;padding:0;min-width:0}
.emogrid button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:var(--surface)}
.kinds{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.kind{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:8px 9px;font-size:13px;font-weight:600;min-width:0;text-align:left}
.kind svg{width:17px;height:17px;flex:none;color:var(--muted)}
.kind span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kind[aria-pressed="true"]{border-color:var(--ink);background:var(--surface);box-shadow:inset 0 0 0 1px var(--ink)}
.kind[aria-pressed="true"] svg{color:var(--accent)}
.catbtn b{font-size:15px;line-height:1;font-weight:400;flex:none}
@media (max-width:420px){.emogrid{grid-template-columns:repeat(6,1fr)}}
.tx-main{min-width:0}
.tx-title{font-weight:600;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx-sub{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx-amt{font-weight:700;font-size:15px;text-align:right;white-space:nowrap}
.adj-amt{font-size:32px;font-weight:800;margin-top:6px}.adj-amt.in{color:var(--good)}
.hint.adj{grid-column:1/-1;margin:0;padding:10px 12px;border-radius:10px;background:var(--surface-2)}.hint.adj b{color:var(--ink)}
.hint.adj .link{display:inline;text-align:left;padding:0;font-size:inherit}
.tx-amt.in{color:var(--good)} .tx-amt.tr{color:var(--muted)}
.day-h{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;color:var(--muted);padding:14px 4px 6px;letter-spacing:.02em}

.monthnav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.monthnav h2{font-family:var(--font-display);font-size:20px;margin:0;font-weight:800}
.iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:18px;line-height:1;flex:none}
.iconbtn:disabled{opacity:.35;cursor:default}
.search{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:15px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.monthtotal{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.monthtotal b{font-size:22px;font-weight:800}
.mt-in{color:var(--good)}

.bc{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.card-h+.bc{border-top:0;padding-top:0}
.bc-top{display:flex;align-items:center;gap:10px;min-width:0}
.bc-name{flex:1;min-width:0;width:100%;border:1px solid transparent;border-radius:8px;background:none;color:var(--ink);font:600 16px/1.2 var(--font-display);padding:6px 8px;margin-left:-4px}
.bc-name:hover{background:var(--surface-2)}
.bc-name:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.bc-lims{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;padding-left:46px}
.lim{display:flex;align-items:center;gap:8px;min-width:0;height:36px;padding:0 12px;border:1px solid transparent;border-radius:9px;background:var(--surface-2);cursor:text;transition:border-color .15s,background .15s}
.lim:focus-within{border-color:var(--accent);background:var(--surface)}
.lim>span{flex:none;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.lim:not(:has(input:placeholder-shown))>span{color:var(--muted)}
.lim>i{font-style:normal;color:var(--muted);margin-left:auto;margin-right:-6px;font-size:15px;font-weight:600}
.lim input{flex:0 1 auto;min-width:1ch;max-width:100%;border:0;padding:0;background:none;outline:none;text-align:right;color:var(--ink);font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.lim input::placeholder{color:var(--faint);font-weight:500}
.lim:has(input:placeholder-shown)>i{display:none}
.lim:has(input:placeholder-shown) input{margin-left:auto}
.lim.is-auto input{color:var(--muted);font-weight:500}
.lim.is-auto>i{font-size:0;margin-right:-4px}.lim.is-auto>i::before{content:"≈";font-size:16px;color:var(--faint)}
@media (max-width:360px){.totals,.bc-lims{grid-template-columns:minmax(0,1fr)}}
.lim.big{height:46px;border-color:var(--line)}.lim.big input{font-size:18px}
.bc .x{margin-right:-6px}
.field{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2);font-size:14.5px}
.field.money{text-align:right;font-variant-numeric:tabular-nums}
select.field{appearance:auto}
.x{width:32px;height:32px;border-radius:8px;border:0;background:none;color:var(--faint);font-size:18px;flex:none}
.x:hover{color:var(--crit);background:var(--crit-soft)}
.x.armed{color:#fff;background:var(--crit);font-size:11px;font-weight:700;width:auto;padding:0 6px}
.totals{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lbl{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;min-width:0}
.hint{font-size:12.5px;color:var(--muted);margin:8px 0 0}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;font-family:var(--font-display);font-size:15px;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--crit-soft);color:var(--crit)}
.btn.danger.armed{background:var(--crit);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.btn.sm{padding:8px 14px;font-size:14px;border-radius:10px;flex:none}
.sh-act{display:flex;gap:8px;align-items:center}
.pad{position:fixed;left:0;right:0;bottom:0;z-index:55;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -8px 30px rgba(20,23,31,.10);padding-bottom:env(safe-area-inset-bottom,0px);animation:up .18s ease-out}
.pad-h{display:flex;align-items:center;gap:8px;padding:8px max(12px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.pad-lab{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pad-curs{display:flex;gap:4px;background:var(--surface-2);border-radius:999px;padding:3px}
.pad-curs:empty{display:none}
.pad-curs button{border:0;background:none;border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600;color:var(--muted)}
.pad-curs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(20,23,31,.12)}
.pad-x{border:0;background:none;color:var(--muted);width:36px;height:32px;display:grid;place-items:center;padding:0}

function calcExpr(s){
  s=String(s||"").replace(/,/g,"").replace(/\*/g,"×").replace(/\//g,"÷").replace(/x/gi,"×").replace(/-/g,"−");
  const t=s.match(/\d*\.?\d+|\d+\.?|[+−×÷]/g);if(!t)return null;
  const nums=[],ops=[];let sign=1,i=0;
  if(t[0]==="−"){sign=-1;i=1}else if(t[0]==="+")i=1;
  for(;i<t.length;i++){const x=t[i];if(OPS.includes(x)){if(nums.length>ops.length)ops.push(x)}else if(nums.length===ops.length)nums.push(Number(x))}
  if(!nums.length)return null;if(ops.length>=nums.length)ops.pop();
  nums[0]*=sign;
  const n2=[nums[0]],o2=[];
  for(let k=0;k<ops.length;k++){const o=ops[k],b=nums[k+1];if(o==="×")n2.push(n2.pop()*b);else if(o==="÷"){if(b===0)return null;n2.push(n2.pop()/b)}else{o2.push(o);n2.push(b)}}

  return isFinite(r)?Math.round(r*100)/100:null;
}

function padAttach(inp){

  inp.readOnly=true;inp.setAttribute("inputmode","none");inp.classList.add("padded");
  inp.addEventListener("focus",()=>{if(PAD.inp!==inp)padOpen(inp)});
  inp.addEventListener("click",()=>{if(PAD.inp!==inp)padOpen(inp)});
}
/* Keep the phone's password and contact autofill away from the app's own boxes (sign-in keeps it). */
function noAutofill(root){(root||document).querySelectorAll('input:not([type=password]):not([type=email]):not([autocomplete]),textarea:not([autocomplete])').forEach(i=>{if(!i.closest("#authView")){i.setAttribute("autocomplete","off");i.setAttribute("data-lpignore","true")}})}
try{noAutofill();new MutationObserver(ms=>{const seen=new Set();for(const m of ms)if(m.addedNodes.length&&!seen.has(m.target)){seen.add(m.target);noAutofill(m.target)}}).observe(document.documentElement,{childList:true,subtree:true})}catch(e){}
function toast(msg){const r=$("#toastRoot");r.innerHTML="";const t=document.createElement("div");t.className="toast";t.textContent=msg;r.appendChild(t);clearTimeout(toast._t);toast._t=setTimeout(()=>{r.innerHTML=""},2400)}
function notice(msg){const n=$("#notice");if(msg){n.textContent=msg;n.hidden=false}else n.hidden=true}
function errText(e){
  const c=e&&e.code;
  if(c==="invalid_argument")return"This ledger can only be changed by its owner.";
  if(c==="quota_exceeded")return"Storage is full. Delete some old entries and try again.";
  if(c==="resource_exhausted")return"Too many changes at once. Wait a moment and try again.";
  if(c==="revoked"||c==="not_granted")return"Access to your data was turned off. Reload the page.";
  return"Couldn't save right now. Check your connection and try again.";
}
async function write(fn){try{return await fn()}catch(e){if(e&&e.code==="unavailable"){await new Promise(r=>setTimeout(r,400+Math.random()*600));return await fn()}throw e}}
function fullConfig(patch){
  const c=cfg();
  return Object.assign({},c,{v:2,cats:cats(),incCats:incCats(),accounts:accts(),fx:Object.assign({},DEFAULT_FX,c.fx||{}),weeklyTotal:Number(c.weeklyTotal)||0,monthlyTotal:Number(c.monthlyTotal)||0,fxAt:c.fxAt||null,fxSrc:c.fxSrc||null},patch||{},{updated:Date.now()});
}
async function saveConfig(patch){return write(()=>S.db.doc("config/main").set(fullConfig(patch)))}

/* ---------- tabs ---------- */
function setView(v,push){
  S.view=v;
  VIEWS.forEach(k=>{$("#view-"+k).hidden=k!==v});
  document.querySelectorAll(".tab[data-tab]").forEach(b=>{if(b.dataset.tab===v)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  if(push&&location.hash!=="#"+v){try{history.replaceState(null,"","#"+v)}catch(e){location.hash=v}}
  render();window.scrollTo(0,0);
}
document.querySelectorAll(".tab[data-tab]").forEach(b=>b.addEventListener("click",()=>setView(b.dataset.tab,true)));
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(VIEWS.includes(h)&&h!==S.view)setView(h,false)});
$("#fab").addEventListener("click",()=>openSheet(null));

/* ---------- render ---------- */
function render(){
  const t=new Date();
  $("#topDate").textContent=DOW[t.getDay()]+", "+t.getDate()+" "+MONTHS[t.getMonth()].slice(0,3);
  if(S.view==="overview")renderOverview();
  else if(S.view==="activity")renderActivity();
  else if(S.view==="accounts")renderAccounts();
  else if(S.view==="insights")renderInsights();
  else renderBudgets();
}
function lockedCard(){return '<div class="card empty"><h3>Your budget is private</h3><p>Only the person who owns My Budget can see or change its entries.</p></div>'}

function cmdBlock(){
  let h='<div><form class="cmd" id="cmdForm" autocomplete="off"><input id="cmdIn" placeholder="Spent 450 on dinner from wallet…" value="'+esc(S.cmdText)+'" '+(S.cmdBusy?"disabled":"")+' aria-label="Describe a transaction or ask a question">';
  h+=S.cmdBusy?'<button type="button" class="stop" id="cmdStop">Stop</button>':'<button type="submit" id="cmdGo">Add</button>';
  h+='</form>';
  if(S.cmdBusy)h+='<p class="cmd-hint">Reading that…</p>';
  else if(!S.answer)h+='<p class="cmd-hint">Type it the way you\'d say it. You check every entry before it\'s saved. You can also ask, like "how much on food this month?"</p>';
  h+='</div>';
  if(S.answer)h+='<div class="answer" role="status"><p>'+esc(S.answer)+'</p><button class="x" id="ansX" aria-label="Dismiss">×</button></div>';
  return h;
}
function wireCmd(el){
  const f=el.querySelector("#cmdForm");if(!f)return;
  f.addEventListener("submit",e=>{e.preventDefault();runCmd(el.querySelector("#cmdIn").value)});
  const i=el.querySelector("#cmdIn");i.addEventListener("input",()=>{S.cmdText=i.value});
  const s=el.querySelector("#cmdStop");if(s)s.addEventListener("click",()=>{if(S.cmdCtl)S.cmdCtl.abort()});
  const x=el.querySelector("#ansX");if(x)x.addEventListener("click",()=>{S.answer=null;render()});
}

    }
  }
  const ppl=S.txSeen?peopleOpen():[];
  if(ppl.length){
    h+='<div class="card" style="padding-bottom:6px"><div class="card-h" style="margin-bottom:2px"><h3 class="card-t">Splits</h3><span class="muted" style="font-size:12.5px">Tap to settle</span></div>'+ppl.map(p=>'<button type="button" class="goal-row" data-person="'+esc(p.name)+'"><div class="avatar" aria-hidden="true">'+esc(p.name.charAt(0).toUpperCase())+'</div><div style="min-width:0"><div class="goal-n">'+esc(p.name)+'</div><div class="goal-s">'+(p.net>=0?"owes you":"you owe")+' · '+p.items.length+' item'+(p.items.length===1?"":"s")+'</div></div><div class="goal-r"><b class="num '+(p.net>=0?"mt-in":"neg")+'">'+esc(money(Math.abs(p.net)))+'</b></div></button>').join("")+'</div>';
  }

    h+='<div class="card" style="padding-bottom:6px"><div class="card-h" style="margin-bottom:2px"><h3 class="card-t">Plans</h3><button class="link" data-go="budgets">All plans</button></div>'+ag.slice(0,3).map(goalRow).join("")+'</div>';

function donut(rows,tot){
  const r=52,C=2*Math.PI*r,gap=rows.length>1?2:0;let off=0,s='';
  rows.forEach(o=>{const len=o.v/tot*C;const l=Math.max(len-gap,.5);
    s+='<circle cx="70" cy="70" r="'+r+'" fill="none" stroke="'+esc(o.col)+'" stroke-width="16" stroke-dasharray="'+l.toFixed(2)+' '+(C-l).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'" transform="rotate(-90 70 70)"/>';off+=len});
  return '<svg class="donut" viewBox="0 0 140 140" role="img" aria-label="Spending by category"><circle cx="70" cy="70" r="'+r+'" fill="none" stroke="var(--surface-2)" stroke-width="16"/>'+s+
  '<text x="70" y="66" text-anchor="middle" fill="var(--muted)" font-size="10" font-family="Inter,sans-serif">Total</text><text x="70" y="84" text-anchor="middle" fill="var(--ink)" font-size="15" font-weight="800" font-family="Manrope,sans-serif">'+esc(moneyC(tot))+'</text></svg>';
}
function txRow(x,withDay){
  const a=acct(x.acct),cur=a.currency;
  let badge,title,sub,amt,cls="";
  if(x.type==="adjust"){
    badge='<div class="badge tr">'+ICONS.adjust+'</div>';
    title=x.note||"Balance adjustment";
    sub=a.name+" · not in budget";
    amt=(x.amt>=0?"+":"−")+money(Math.abs(x.amt),cur);cls=x.amt>=0?" in":"";
  }else if(x.type==="transfer"){
    const to=acct(x.toAcct);
    badge='<div class="badge tr">'+ICONS.transfer+'</div>';
    title=x.note||("To "+to.name);
    sub=a.name+" → "+to.name;
    amt=money(x.amt,cur);cls=" tr";
  }else{
    const c=catOf(x);
    badge=catBadge(c);
    title=x.note||c.name;
    sub=(x.note?c.name+" · ":"")+(x.owe&&!x.owe.paid?"Owed to "+x.owe.who:a.name);
    if(x.type==="expense"){if(x.split&&x.split.length)sub+=" · your share "+money(myShare(x),cur);if(x.spread>1)sub+=" · spread "+x.spread+" mo";else if(x.nobudget)sub+=" · not in budget"}
    if(x.orig&&x.orig.cur&&x.orig.cur!==cur)sub+=" · "+money(x.orig.amt,x.orig.cur);
    if(x.type==="income"){amt="+"+money(x.amt,cur);cls=" in"}else amt="−"+money(x.amt,cur);
  }
  if(withDay)sub+=" · "+shortDay(x.date);
  return '<button class="tx" data-tx="'+esc(x.id)+'">'+badge+'<div class="tx-main"><div class="tx-title">'+esc(title)+'</div><div class="tx-sub">'+esc(sub)+'</div></div><div class="tx-amt num'+cls+'">'+esc(amt)+'</div></button>';
}

async function saveAccounts(){
  const D=S.aDraft;
  if(!D.accounts.length){toast("Keep at least one account.");return}
  const usd=D.fxTouched&&D.usd>0?D.usd:fx("USD");
  const prevFx=Object.assign({},DEFAULT_FX,cfg().fx||{});
  // balances depend on currency rates only for cross-currency transfers without a received amount; use new rate for consistency
  const tmpCfg=Object.assign({},cfg(),{fx:Object.assign(prevFx,{USD:usd})});
  const saved=S.config;S.config=tmpCfg;
  const nowBal=balances(),adj=[],when=iso(today());
  const accounts=D.accounts.map(a=>{const flow=flowFor(a.id),old=accts().find(x=>x.id===a.id);
    let opening=Math.round(((Number(a.bal)||0)-flow)*100)/100;
    const d=old&&old.currency===a.currency?Math.round(((Number(a.bal)||0)-(nowBal[a.id]||0))*100)/100:0;
    if(d&&!a.fixStart){opening=Number(old.opening)||0;adj.push({type:"adjust",amt:d,acct:a.id,date:when,note:a.countedAt&&Date.now()-a.countedAt<60000?"Cash count difference":"",ts:Date.now(),src:"manual"})}
    return{id:a.id,name:(a.name||"").trim()||"Account",kind:a.kind,currency:a.currency,excl:!!a.excl,notes:a.notes||null,countedAt:a.countedAt||null,opening}});
  S.config=saved;
  const b=$("#saveA");if(b){b.disabled=true;b.textContent="Saving…"}
  try{await saveConfig(Object.assign({accounts,fx:Object.assign({},prevFx,{USD:usd})},D.fxTouched?{fxSrc:"manual",fxAt:Date.now(),fxAuto:false}:{}));
    for(const t of adj){const ref=S.db.collection("txns").doc();await write(()=>ref.set(t))}
    S.aDirty=false;S.aDraft=null;toast(adj.length?"Accounts saved · "+adj.length+" adjustment"+(adj.length===1?"":"s")+" added":"Accounts saved");render()}
  catch(e){toast(errText(e));if(b){b.disabled=false;b.textContent="Save accounts"}}
}

/* A week and month limit pair. auto: "m" = month follows week, "w" = week follows month, "" = both typed by you. */
function linkPair(p,auto){
  const w=Number(p.weekly)||0,m=Number(p.monthly)||0;
  if(auto==="m"||auto==="w")p.auto=auto;else if(auto==="")p.auto=w&&m?"":w?"m":m?"w":null;else p.auto=w&&!m?"m":m&&!w?"w":w&&m?"":null;

  return p;
}

function buildPrompt(text){
  const t=today();
  const al=accts().map(a=>({id:a.id,name:a.name,type:KINDS[a.kind]||a.kind,currency:a.currency}));
  const lines=sortTx(S.txns).slice(0,300).map(x=>[x.date,x.type,x.amt,curOf(x.acct),acct(x.acct).name+(x.toAcct?" -> "+acct(x.toAcct).name:""),x.type==="transfer"?"":catOf(x).name,x.note||""].join(" | "));
  const bal=balances();
  return [
"You are the input parser inside a personal expense tracker. Read the person's message and either turn it into ledger entries or answer a question about their money.",
"Today is "+DOW[t.getDay()]+" "+iso(t)+". The person lives in India; amounts are in rupees unless they say dollars or the account is in USD.",
"",
"Accounts: "+JSON.stringify(al),
"Expense categories: "+JSON.stringify(cats().map(c=>({id:c.id,name:c.name}))),
"Income categories: "+JSON.stringify(incCats().map(c=>({id:c.id,name:c.name}))),
"",
"Entry rules:",
"- type is \"expense\", \"income\" or \"transfer\". Moving money between their own accounts (ATM withdrawal, saving to reserve, sending to the USD account) is a transfer, not an expense.",
"- amount is a positive number in the source account's currency. \"50k\" = 50000, \"1.5L\" or \"1.5 lakh\" = 150000.",
"- account is an account id. If not stated: cash payments use the cash account; UPI, GPay, PhonePe, card or online payments use \""+defaultAcct()+"\"; otherwise \""+defaultAcct()+"\". For transfers, account is where money left and to_account is where it arrived. ATM withdrawal = transfer from the bank account to the cash account.",
"- amount_received: only for transfers between accounts of different currencies, the amount that arrived, if the message says it; otherwise null.",
"- category is a category id from the matching list (expense or income); pick the closest fit; null for transfers.",
"- date is YYYY-MM-DD. Resolve words like yesterday or last Friday from today's date. Default to today.",
"- note is a short label a person would write, like \"Dinner at Saravana Bhavan\" or \"Uber to college\". Keep merchant or purpose; leave out the amount.",
"- One message can hold several entries; return them all.",
"",
"If the message is a question about their spending, income or balances, answer it in 1 to 4 plain sentences using only the data below. Write rupees like ₹12,500 with Indian digit grouping. If the data can't answer it, say so briefly.",
"If the message is neither, answer briefly with what you can do: log expenses, income and transfers, or answer questions about their money.",
"",
"Reply with JSON only, in exactly one of these shapes:",
"{\"kind\":\"entries\",\"entries\":[{\"type\":\"expense\",\"amount\":450,\"account\":\"wallet\",\"to_account\":null,\"amount_received\":null,\"category\":\"food\",\"date\":\""+iso(t)+"\",\"note\":\"Dinner\"}]}",
"{\"kind\":\"answer\",\"text\":\"...\"}",
"",
"Current balances: "+JSON.stringify(accts().map(a=>({account:a.name,currency:a.currency,balance:Math.round((bal[a.id]||0)*100)/100}))),
"Monthly budget (INR): "+(limitTotal("month")||"none")+". Category monthly budgets: "+JSON.stringify(cats().filter(c=>Number(c.monthly)>0).map(c=>({category:c.name,monthly:c.monthly}))),
"Transactions, newest first (date | type | amount | currency | account | category | note):",
lines.length?lines.join("\n"):"(none yet)",
"",
"Message:",
"\"\"\""+text+"\"\"\""
  ].join("\n");
}
function cleanEntry(e){
  if(!e||typeof e!=="object")return null;
  const type=TYPES[e.type]?e.type:"expense";
  const amt=Number(e.amount);if(!isFinite(amt)||amt<=0)return null;
  const ids=accts().map(a=>a.id);
  let a=ids.includes(e.account)?e.account:defaultAcct();
  const out={type,amt:Math.round(amt*100)/100,acct:a,date:/^\d{4}-\d{2}-\d{2}$/.test(e.date||"")?e.date:iso(today()),note:typeof e.note==="string"?e.note.slice(0,120):""};
  if(type==="transfer"){
    out.toAcct=ids.includes(e.to_account)&&e.to_account!==a?e.to_account:"";
    const r=Number(e.amount_received);if(isFinite(r)&&r>0)out.amtTo=Math.round(r*100)/100;
  }else{
    const list=type==="income"?incCats():cats();
    out.cat=list.some(c=>c.id===e.category)?e.category:(type==="income"?"other_inc":"other");
    if(!list.some(c=>c.id===out.cat))out.cat="";
  }
  return out;
}
async function runCmd(text){
  text=(text||"").trim();if(!text||S.cmdBusy||!S.sample)return;
  if(!S.db){toast("Your data isn't connected yet.");return}
  S.cmdBusy=true;S.answer=null;S.cmdCtl=new AbortController();S.cmdText=text;render();
  try{
    const res=await S.sample.json(buildPrompt(text),{signal:S.cmdCtl.signal,cache:false});
    if(res&&res.kind==="entries"&&Array.isArray(res.entries)){
      const list=res.entries.map(cleanEntry).filter(Boolean);
      if(!list.length){S.answer="I couldn't find an amount in that. Try something like \"Spent 300 on lunch from wallet\"."}
      else{S.cmdText="";S.cmdBusy=false;render();reviewQueue(list);return}
    }else if(res&&typeof res.text==="string")S.answer=res.text;
    else S.answer="I couldn't read that. Try rephrasing it.";
  }catch(e){
    const c=e&&e.code;
    if(c==="cancelled"){}
    else if(c==="not_granted"||c==="sampling_disabled"||c==="capability_disabled"||c==="capability_removed"||c==="not_declared"){S.sample=null;toast("Typing entries is turned off for this page. Use the + button instead.")}
    else if(c==="rate_limited")S.answer="You've hit the usage limit for now. Try again in a little while, or use the + button.";
    else if(c==="session_expired")S.answer="Your sign-in expired. Reload the page and try again.";
    else if(c==="invalid_json")S.answer="That didn't come back in a form I could use. Try once more with a simpler sentence.";
    else S.answer="Couldn't reach the assistant just now. Try again, or use the + button.";
  }
  S.cmdBusy=false;S.cmdCtl=null;render();
}
function reviewQueue(list){
  const total=list.length;let i=0;
  const next=()=>{
    if(i>=list.length)return;
    const e=list[i];i++;
    openSheet(e,{title:total>1?"Check entry "+i+" of "+total:"Check and save",note:"Filled in from what you typed. Change anything that's off, then save.",src:"assistant",skip:total>1,onClose:()=>setTimeout(next,120)});
  };
  next();
}

/* ---------- plans ---------- */
const GOAL_COL="var(--accent)";
const daysBetween=(a,b)=>Math.round((b-a)/864e5);
const r2=n=>Math.round((Number(n)||0)*100)/100;
const lineTotal=it=>r2((Number(it.a)||0)*(1+(Number(it.t)||0)/100));
function planTotal(g){return(g.items&&g.items.length)?r2(g.items.reduce((t,it)=>t+lineTotal(it),0)+(Number(g.buffer)||0)):Number(g.target)||0}
function gSaved(g){return r2((g.saved||[]).reduce((t,x)=>t+(Number(x.a)||0),0))}
function gPaid(g){return r2((g.items||[]).filter(it=>it.paid).reduce((t,it)=>t+lineTotal(it),0))}
function shortDate(s){const d=parseISO(s);return d.getDate()+" "+MONTHS[d.getMonth()].slice(0,3)+(d.getFullYear()!==today().getFullYear()?" "+d.getFullYear():"")}
function goalCalc(g){
  const t=today(),target=planTotal(g),saved=r2(Math.max(gSaved(g),0)+gPaid(g)),rem=Math.max(r2(target-saved),0);
  const pct=target?Math.min(saved/target,1):0;
  const due=g.due?parseISO(g.due):null;
  const weeksLeft=due?Math.max(daysBetween(t,due)/7,0):0,perWk=rem?Math.ceil(rem/Math.max(weeksLeft,1)):0;
  let status="On track",cls="good";
  if(rem<=0){status="Ready";cls="good"}
  else if(due&&due<=t){status="Due now";cls="crit"}
  else if(due){
    const start=new Date(g.created||Date.now());start.setHours(0,0,0,0);
    const span=Math.max(daysBetween(start,due),1),frac=Math.min(Math.max(daysBetween(start,t)/span,0),1);
    const gap=target*frac-saved;
    if(gap>Math.max(target*0.02,100)){status=moneyC(gap)+" behind";cls=gap>target*0.1?"crit":"warn"}
  }
  return{target,saved,rem,pct,weeksLeft,perWk,status,cls};
}
function ringSVG(pct,size,emoji){
  const sw=size>60?8:5,r=(size-sw)/2,c=2*Math.PI*r,done=pct>=1;
  return '<svg class="ring" width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" aria-hidden="true"><circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="var(--surface-2)" stroke-width="'+sw+'"/>'+
    '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+(done?"var(--good)":GOAL_COL)+'" stroke-width="'+sw+'" stroke-linecap="round" stroke-dasharray="'+(c*pct).toFixed(2)+' '+c.toFixed(2)+'" transform="rotate(-90 '+size/2+' '+size/2+')"/>'+
    '<text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" font-size="'+(size>60?30:18)+'">'+esc(emoji||"🎯")+'</text></svg>';
}
function goalRow(g){
  const k=goalCalc(g);
  return '<button type="button" class="goal-row" data-goal="'+esc(g.id)+'">'+ringSVG(k.pct,44,g.emoji)+'<div style="min-width:0"><div class="goal-n">'+esc(g.name||"Plan")+'</div><div class="goal-s num">'+esc(moneyC(k.saved))+' of '+esc(moneyC(k.target))+(g.due?' · by '+esc(shortDate(g.due)):'')+'</div></div>'+
    '<div class="goal-r">'+(k.rem>0&&!g.done?'<b class="num">'+esc(moneyC(k.perWk))+'<span class="muted" style="font-weight:500;font-size:12px">/wk</span></b>':'')+'<small class="pill '+(g.done?"none":k.cls)+'" style="padding:1px 7px">'+esc(g.done?"Done":k.status)+'</small></div></button>';
}
function activeGoals(){return S.goals.filter(g=>!g.done).sort((a,b)=>String(a.due||"9").localeCompare(String(b.due||"9")))}
function planBody(g){const b=Object.assign({},g);delete b.id;return b}
async function saveGoal(id,body){const ref=id?S.db.doc("goals/"+id):S.db.collection("goals").doc();await write(()=>ref.set(body));return ref.id}
async function addToGoal(g,amt,note){const body=planBody(g);body.saved=(g.saved||[]).concat([{d:iso(today()),a:r2(amt),n:note||""}]);await saveGoal(g.id,body)}
async function markPaid(id,i,on){
  const g=S.goals.find(x=>x.id===id);if(!g||!(g.items||[])[i])return;
  const body=planBody(g);body.items=g.items.map(x=>Object.assign({},x));body.saved=(g.saved||[]).slice();
  const it=body.items[i],nm=it.n||"item";
  if(on){const used=Math.min(Math.max(gSaved(g),0),lineTotal(it));it.paid=iso(today());it.used=used;if(used>0)body.saved.push({d:iso(today()),a:-used,n:"Used for "+nm})}
  else{if(it.used>0)body.saved.push({d:iso(today()),a:it.used,n:"Back from "+nm});it.paid=null;it.used=0}
  try{await saveGoal(id,body);toast(on?"Marked as paid":"Marked as not paid")}catch(e){toast(errText(e))}
}
const safeUrl=u=>{u=String(u||"").trim();return /^https?:\/\//i.test(u)?u:"https://"+u.replace(/^[a-z]+:/i,"")};
const LOOK=[["flights","Flights"],["hotels","Hotels"],["web","Web"]];
function lookUrl(k,q){q=encodeURIComponent((q||"").trim()||"trip");return k==="flights"?"https://www.google.com/travel/flights?q="+q:k==="hotels"?"https://www.google.com/travel/hotels?q="+q:"https://www.google.com/search?q="+q+"%20price"}
function openGoal(id){
  const g=S.goals.find(x=>x.id===id);if(!g)return;
  const k=goalCalc(g),root=$("#sheetRoot");
  let h='<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="gT"><div class="grab"></div>';
  h+='<div class="sheet-h"><h2 id="gT">'+esc(g.name||"Plan")+'</h2><div class="sh-act"><button class="link" id="gEdit">Edit</button><button class="iconbtn" id="shX" aria-label="Close">×</button></div></div>';
  h+='<div class="g-hero">'+ringSVG(k.pct,88,g.emoji)+'<div><div class="g-big num">'+esc(money(k.saved))+'</div><div class="muted">covered of <b class="num" style="color:var(--ink)">'+esc(money(k.target))+'</b></div><span class="pill '+k.cls+'" style="margin-top:6px">'+esc(k.status)+'</span></div></div>';
  if(k.rem>0&&g.due){
    h+='<div class="g-plan">Save <b class="num">'+esc(moneyC(k.perWk))+' a week</b> to be ready by <b>'+esc(shortDate(g.due))+'</b>'+(k.weeksLeft>=1?' <span class="muted">('+Math.round(k.weeksLeft)+' weeks)</span>':'');
    const wl=limitTotal("week");if(wl)h+='<span class="alt">That\'s '+Math.round(k.perWk/wl*100)+'% of your weekly budget.</span>';
    h+='</div>';
  }
  if((g.items||[]).length){
    h+='<div class="g-items">'+g.items.map((it,i)=>'<div class="g-item"><span class="gi-n">'+esc(it.n||"Item")+(Number(it.t)?' <small class="muted">incl. '+esc(String(it.t))+'% tax</small>':'')+(it.l?' <a class="link" href="'+esc(safeUrl(it.l))+'" target="_blank" rel="noopener" aria-label="Open the saved link">↗</a>':'')+'</span><span class="gi-r"><b class="num">'+esc(money(lineTotal(it)))+'</b>'+(it.paid?'<button type="button" class="pill good gi-b" data-unpay="'+i+'">Paid ✓</button>':'<button type="button" class="link gi-b" data-pay="'+i+'">Pay</button>')+'</span></div>').join("");
    if(Number(g.buffer)>0)h+='<div class="g-item"><span class="muted">Buffer</span><span class="gi-r"><b class="num">'+esc(money(g.buffer))+'</b></span></div>';
    h+='</div>';
  }
  if(k.rem>0){
    h+='<label class="f-label" for="gAmt">Set money aside</label><div class="g-add"><input class="field money num" id="gAmt" inputmode="decimal" placeholder="0.00"><button class="btn sm" id="gAddBtn">Add</button></div>';
    const q=[Math.round(k.perWk),500,1000].filter((v,i,a)=>v>0&&a.indexOf(v)===i);
    h+='<div class="qchips">'+q.map(v=>'<button type="button" data-q="'+v+'">'+esc(moneyC(v))+(v===Math.round(k.perWk)?' · this week':'')+'</button>').join("")+'</div>';
  }
  const hist=(g.saved||[]).map((x,i)=>({x,i})).reverse().slice(0,6);
  if(hist.length)h+='<div class="g-hist"><div class="den-h">Set aside</div>'+hist.map(o=>'<div class="g-item"><span>'+esc(shortDate(o.x.d))+(o.x.n?' · '+esc(o.x.n):'')+'</span><span class="gi-r"><b class="num" style="color:var(--ink)">'+esc(money(o.x.a))+'</b><button class="x" data-rm="'+o.i+'" aria-label="Remove this amount" style="width:26px;height:26px;font-size:15px">×</button></span></div>').join("")+'</div>';
  h+='<div class="err" id="gErr" role="alert"></div></div></div>';
  root.innerHTML=h;armMoney(root);
  const close=()=>{root.innerHTML=""};
  $("#scrim").addEventListener("click",e=>{if(e.target.id==="scrim")close()});
  $("#shX").addEventListener("click",close);
  $("#gEdit").addEventListener("click",()=>{close();openGoalEdit(id)});
  const add=async v=>{if(!(v>0)){$("#gErr").textContent="Enter an amount above zero.";return}try{await addToGoal(g,v);close();toast("Set aside "+money(v)+" for "+(g.name||"plan"))}catch(e){$("#gErr").textContent=errText(e)}};
  const ab=$("#gAddBtn");if(ab)ab.addEventListener("click",()=>add(num($("#gAmt").value)));
  root.querySelectorAll("[data-q]").forEach(b=>b.addEventListener("click",()=>add(Number(b.dataset.q))));
  root.querySelectorAll("[data-pay]").forEach(b=>b.addEventListener("click",()=>{
    const i=+b.dataset.pay,it=g.items[i],nm=it.n||g.name||"Plan";close();
    openSheet({type:"expense",amt:lineTotal(it),note:it.n&&g.name?it.n+" · "+g.name:nm,nobudget:true},{title:"Pay: "+nm,note:"Saving this marks it as paid in your plan. It's left out of your weekly budget because you saved for it separately.",skip:true,skipLabel:"Just mark paid",onSkip:()=>markPaid(id,i,true),onSaved:()=>markPaid(id,i,true)});
  }));
  root.querySelectorAll("[data-unpay]").forEach(b=>b.addEventListener("click",()=>{
    if(!b.dataset.armed){b.dataset.armed="1";b.textContent="Undo paid?";b.className="pill warn gi-b";return}
    close();markPaid(id,+b.dataset.unpay,false);
  }));
  root.querySelectorAll("[data-rm]").forEach(b=>b.addEventListener("click",async()=>{
    if(!b.classList.contains("armed")){b.classList.add("armed");b.textContent="Remove";return}
    const body=planBody(g);body.saved=(g.saved||[]).filter((x,i)=>i!==+b.dataset.rm);
    try{await saveGoal(id,body);close();setTimeout(()=>openGoal(id),150)}catch(e){$("#gErr").textContent=errText(e)}
  }));
}
function openGoalEdit(id){
  const g=id?S.goals.find(x=>x.id===id):null;
  const st={name:g?g.name:"",emoji:g?g.emoji||"":"",items:g&&g.items&&g.items.length?g.items.map(x=>Object.assign({n:"",a:0,t:0,l:""},x)):[{n:"",a:0,t:0,l:""}],buffer:g?Number(g.buffer)||0:0,due:g?g.due||"":"",already:0,open:-1};
  const root=$("#sheetRoot");
  const close=()=>{root.innerHTML=""};
  const subTotal=()=>r2(st.items.reduce((t,x)=>t+lineTotal(x),0));
  function paint(){
    let h='<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="geT"><div class="grab"></div>';
    h+='<div class="sheet-h"><h2 id="geT">'+(g?"Edit plan":"New plan")+'</h2><div class="sh-act"><button class="btn sm" id="geSave">Save</button><button class="iconbtn" id="shX" aria-label="Close">×</button></div></div>';
    h+='<div class="catpanel" style="margin:0"><button type="button" class="emo'+(st.emoji?' has':'')+'" id="geEmo" aria-label="Choose an emoji">'+(st.emoji?esc(st.emoji):'<span style="font-size:15px;color:var(--faint)">+</span>')+'</button><input class="field" id="geName" maxlength="40" placeholder="e.g. Trek in April" value="'+esc(st.name)+'"></div>';
    h+='<label class="f-label">What it costs</label>';
    st.items.forEach((it,i)=>{
      const extra=Number(it.t)>0||(it.l||"").trim();
      h+='<div class="it-row"><input class="field" data-in="'+i+'" maxlength="60" placeholder="'+(i?"e.g. Flight Chennai to Dehradun":"e.g. Registration fee")+'" value="'+esc(it.n)+'"'+(it.paid?' disabled':'')+'><input class="field money num" data-ia="'+i+'" inputmode="decimal" placeholder="0.00" value="'+esc(it.a?fmtFixed(it.a):"")+'"'+(it.paid?' disabled':'')+'><button type="button" class="x'+(extra?' on':'')+'" data-im="'+i+'" aria-expanded="'+(st.open===i)+'" aria-label="Tax, link and price lookup">⋯</button>'+(st.items.length>1&&!it.paid?'<button type="button" class="x" data-ix="'+i+'" aria-label="Remove line">×</button>':'<span></span>')+'</div>';
      if(st.open===i){
        h+='<div class="it-more"><div class="it-tax"><label for="tx-'+i+'">Tax / GST %</label><input class="field num" id="tx-'+i+'" data-it="'+i+'" inputmode="decimal" placeholder="0" value="'+esc(Number(it.t)?String(it.t):"")+'"><span class="qchips" style="margin:0">'+[5,12,18].map(v=>'<button type="button" data-tq="'+i+':'+v+'">'+v+'%</button>').join("")+'</span></div>';
        h+='<input class="field" data-il="'+i+'" inputmode="url" autocapitalize="off" autocomplete="off" placeholder="Paste a link to the price you found" value="'+esc(it.l||"")+'">';
        h+='<div class="it-look"><span class="muted">Look up a price</span>'+LOOK.map(([key,lab])=>'<a class="link" data-lk="'+key+':'+i+'" target="_blank" rel="noopener" href="'+esc(lookUrl(key,it.n||st.name))+'">'+lab+' ↗</a>').join("")+'</div></div>';
      }
    });
    h+='<div style="margin-top:10px"><button type="button" class="link" id="geAddItem">+ Add a line</button></div>';
    h+='<label class="f-label" for="geBuf">Buffer for surprises</label><div class="g-add" style="margin-top:0"><input class="field money num" id="geBuf" inputmode="decimal" placeholder="0.00" value="'+esc(st.buffer?fmtFixed(st.buffer):"")+'"><span class="qchips" style="margin:0"><button type="button" data-bq="10">10%</button><button type="button" data-bq="15">15%</button></span></div>';
    h+='<div class="count-total"><span class="eyebrow">Plan total</span><b class="num" id="geTot">'+esc(money(subTotal()+st.buffer))+'</b></div>';
    h+='<label class="f-label" for="geDue">Need it by</label><input class="field" type="date" id="geDue" value="'+esc(st.due)+'" min="'+iso(today())+'">';
    if(!g)h+='<label class="f-label" for="geAlready">Already saved for it</label><input class="field money num" id="geAlready" inputmode="decimal" placeholder="0.00" value="'+esc(st.already?fmtFixed(st.already):"")+'">';
    h+='<div class="err" id="geErr" role="alert"></div>';
    if(g)h+='<div class="actions" style="margin-top:6px"><button class="btn ghost" id="geDone" style="flex:1">'+(g.done?"Reopen plan":"Mark as done")+'</button><button class="btn danger" id="geDel" style="flex:0 0 auto">Delete</button></div>';
    h+='</div></div>';
    root.innerHTML=h;armMoney(root);wire();
  }
  function grab(){
    const n=$("#geName");if(n)st.name=n.value;
    root.querySelectorAll("[data-in]").forEach(i=>{st.items[+i.dataset.in].n=i.value});
    root.querySelectorAll("[data-ia]").forEach(i=>{st.items[+i.dataset.ia].a=num(i.value)});
    root.querySelectorAll("[data-it]").forEach(i=>{st.items[+i.dataset.it].t=Math.min(Math.max(num(i.value),0),100)});
    root.querySelectorAll("[data-il]").forEach(i=>{st.items[+i.dataset.il].l=i.value});
    const b=$("#geBuf");if(b)st.buffer=Math.max(num(b.value),0);
    const d=$("#geDue");if(d)st.due=d.value;const a=$("#geAlready");if(a)st.already=Math.max(num(a.value),0);
  }
  function wire(){
    $("#scrim").addEventListener("click",e=>{if(e.target.id==="scrim")close()});
    $("#shX").addEventListener("click",close);
    const tot=()=>{grab();$("#geTot").textContent=money(subTotal()+st.buffer)};
    root.querySelectorAll("[data-ia],[data-it],#geBuf").forEach(i=>i.addEventListener("input",tot));
    root.querySelectorAll("[data-in]").forEach(i=>i.addEventListener("input",()=>{const k=i.dataset.in;root.querySelectorAll("[data-lk]").forEach(a=>{const[key,idx]=a.dataset.lk.split(":");if(idx===k)a.href=lookUrl(key,i.value||st.name)})}));
    root.querySelectorAll("[data-im]").forEach(b=>b.addEventListener("click",()=>{grab();const i=+b.dataset.im;st.open=st.open===i?-1:i;paint()}));
    root.querySelectorAll("[data-tq]").forEach(b=>b.addEventListener("click",()=>{grab();const[i,v]=b.dataset.tq.split(":");st.items[+i].t=+v;paint()}));
    root.querySelectorAll("[data-bq]").forEach(b=>b.addEventListener("click",()=>{grab();st.buffer=r2(subTotal()*(+b.dataset.bq)/100);paint()}));
    $("#geAddItem").addEventListener("click",()=>{grab();st.items.push({n:"",a:0,t:0,l:""});paint();const ins=root.querySelectorAll("[data-in]");ins[ins.length-1].focus()});
    root.querySelectorAll("[data-ix]").forEach(b=>b.addEventListener("click",()=>{grab();st.items.splice(+b.dataset.ix,1);st.open=-1;paint()}));
    $("#geEmo").addEventListener("click",()=>{grab();openEmoji({name:st.name||"plan",emoji:st.emoji},e=>{st.emoji=e;paint()},$("#pickRoot"))});
    $("#geSave").addEventListener("click",save);
    const dn=$("#geDone");if(dn)dn.addEventListener("click",async()=>{const body=planBody(g);body.done=!g.done;try{await saveGoal(g.id,body);close();toast(body.done?"Plan marked as done":"Plan reopened")}catch(e){$("#geErr").textContent=errText(e)}});
    const dl=$("#geDel");if(dl)dl.addEventListener("click",async()=>{if(!dl.classList.contains("armed")){dl.classList.add("armed");dl.textContent="Tap again to delete";return}try{await write(()=>S.db.doc("goals/"+g.id).delete());close();toast("Plan deleted")}catch(e){$("#geErr").textContent=errText(e)}});
  }
  async function save(){
    grab();const err=$("#geErr");
    const items=st.items.filter(x=>(x.n||"").trim()||Number(x.a)>0).map(x=>({n:(x.n||"").trim(),a:r2(x.a),t:Number(x.t)||0,l:(x.l||"").trim(),paid:x.paid||null,used:Number(x.used)||0}));
    const buffer=r2(st.buffer),target=planTotal({items,buffer});
    if(!st.name.trim()){err.textContent="Give the plan a name.";$("#geName").focus();return}
    if(!items.length||!(target>0)){err.textContent="Add what it costs.";return}
    if(!/^\d{4}-\d{2}-\d{2}$/.test(st.due)){err.textContent="Pick the date you need it by.";return}
    const body={name:st.name.trim(),emoji:st.emoji||"",items,buffer,target,due:st.due,created:g?(g.created||Date.now()):Date.now(),saved:g?(g.saved||[]):(st.already>0?[{d:iso(today()),a:r2(st.already),n:"Already saved"}]:[]),done:g?!!g.done:false};
    const b=$("#geSave");b.disabled=true;
    try{const nid=await saveGoal(g?g.id:null,body);close();toast(g?"Plan updated":"Plan added");setTimeout(()=>openGoal(nid),250)}catch(e){b.disabled=false;err.textContent=errText(e)}
  }
  paint();
  if(!g)setTimeout(()=>{const n=$("#geName");if(n)n.focus()},60);
}
/* ---------- splits ---------- */
function openPerson(name){
  const find=()=>peopleOpen().find(x=>x.name.toLowerCase()===String(name).toLowerCase());
  const p=find();if(!p)return;
  let sel=lastAcct();if(!accts().some(a=>a.id===sel))sel=defaultAcct();
  const root=$("#sheetRoot");const close=()=>{root.innerHTML=""};
  const hasIn=p.items.some(o=>o.dir==="in"),hasOut=p.items.some(o=>o.dir==="out");
  async function settle(list){
    const byTx=new Map();list.forEach(o=>{if(!byTx.has(o.t.id))byTx.set(o.t.id,[]);byTx.get(o.t.id).push(o)});
    for(const [tid,os] of byTx){
      const t=os[0].t,body=Object.assign({},t);delete body.id;
      const idx=new Set(os.filter(o=>o.dir==="in").map(o=>o.i));
      if(idx.size)body.split=t.split.map((x,i)=>idx.has(i)?Object.assign({},x,{paid:{d:iso(today()),acct:sel}}):x);
      if(os.some(o=>o.dir==="out")){body.acct=sel;body.owe=Object.assign({},t.owe,{paid:{d:iso(today())}})}
      await write(()=>S.db.doc("txns/"+tid).set(body));
    }
  }
  function paint(){
    let h='<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="ppT"><div class="grab"></div>';
    h+='<div class="sheet-h"><h2 id="ppT">'+esc(p.name)+'</h2><button class="iconbtn" id="shX" aria-label="Close">×</button></div>';
    h+='<div class="monthtotal" style="margin-bottom:4px"><div><span class="eyebrow">'+(p.net>=0?"Owes you":"You owe")+'</span><div><b class="num '+(p.net>=0?"mt-in":"neg")+'">'+esc(money(Math.abs(p.net)))+'</b></div></div></div>';
    h+='<label class="f-label">'+(hasIn&&hasOut?"Account":hasIn?"Money comes into":"Pay from")+'</label><div class="chips">'+accts().map(a=>'<button type="button" class="chip" data-pa="'+esc(a.id)+'" aria-pressed="'+(sel===a.id)+'">'+esc(a.name)+'</button>').join("")+'</div>';
    h+='<div class="g-items" style="margin-top:14px">'+p.items.map((o,i)=>'<div class="g-item"><span class="gi-n">'+esc(o.t.note||catOf(o.t).name)+' <small class="muted">'+esc(shortDate(o.t.date))+'</small></span><span class="gi-r"><b class="num '+(o.dir==="in"?"mt-in":"neg")+'">'+(o.dir==="in"?"+":"−")+esc(money(o.a,o.cur))+'</b><button type="button" class="btn ghost sm" data-st="'+i+'">'+(o.dir==="in"?"Got it":"Paid")+'</button></span></div>').join("")+'</div>';
    if(p.items.length>1)h+='<div class="actions" style="margin-top:14px"><button class="btn" id="stAll" style="flex:1">Settle everything</button></div>';
    h+='<div class="err" id="ppErr" role="alert"></div></div></div>';
    root.innerHTML=h;
    $("#scrim").addEventListener("click",e=>{if(e.target.id==="scrim")close()});

function paceInfo(spent,limit,elapsed){
  if(!limit)return{col:null,cls:"none",t:0};
  const used=spent/limit;
  if(used>1)return{col:"hsl(4 72% 50%)",cls:"crit",t:1};
  const r=used/Math.max(elapsed,0.06);
  const t=Math.max(0,Math.min(1,(r-0.85)/0.65));
  const hue=Math.round(140-136*t);
  return{col:"hsl("+hue+" 62% "+(46-4*t)+"%)",cls:t<0.35?"good":t<0.75?"warn":"crit",t};
}
function compactINR(n){n=Math.round(n);const a=Math.abs(n);if(a>=1e5)return"₹"+(n/1e5).toFixed(a>=1e6?0:1).replace(/\.0$/,"")+"L";if(a>=1e3)return"₹"+(n/1e3).toFixed(a>=1e4?0:1).replace(/\.0$/,"")+"k";return"₹"+n}
function paceChart(per,t,exp,limit,elapsed){
  const y=t.getFullYear(),m=t.getMonth();
  const days=per==="week"?7:daysIn(y,m);
  const start=per==="week"?weekStart(t):new Date(y,m,1);
  const ti=per==="week"?(t.getDay()+6)%7:t.getDate()-1;
  const daily=new Array(days).fill(0);
  exp.forEach(x=>{const d=parseISO(x.date);const k=Math.round((d-start)/864e5);if(k>=0&&k<days)daily[k]+=inINR(x)});
  const cum=[];daily.reduce((a,v,i)=>(cum[i]=a+v),0);
  const spent=cum[ti]||0;
  const W=320,H=160,L=6,Rp=6,T=18,B=24,pw=W-L-Rp,ph=H-T-B;
  const maxY=Math.max(limit||0,spent,1)*1.1;
  const X=i=>L+(i+1)/days*pw, Y=v=>T+ph-(v/maxY)*ph, base=T+ph;
  const pi=paceInfo(spent,limit,elapsed);const col=pi.col||"var(--accent)";
  let pts=[[L,base]];for(let i=0;i<=ti;i++)pts.push([X(i),Y(cum[i])]);
  const line=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const area=line+" L"+X(ti).toFixed(1)+" "+base+" Z";
  let g='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Spending so far against an even pace">';
  g+='<line x1="'+L+'" x2="'+(W-Rp)+'" y1="'+base+'" y2="'+base+'" stroke="var(--line)" stroke-width="1"/>';
  if(limit){
    g+='<line x1="'+L+'" x2="'+(W-Rp)+'" y1="'+Y(limit).toFixed(1)+'" y2="'+Y(limit).toFixed(1)+'" stroke="var(--line)" stroke-width="1"/>';
    g+='<text x="'+(L+2)+'" y="'+(Y(limit)-5).toFixed(1)+'" text-anchor="start" font-size="10" fill="var(--muted)" font-family="Inter,sans-serif">Budget '+esc(compactINR(limit))+'</text>';
    g+='<line x1="'+L+'" y1="'+base+'" x2="'+(W-Rp)+'" y2="'+Y(limit).toFixed(1)+'" stroke="var(--muted)" stroke-width="1.4" stroke-dasharray="4 4"/>';
  }
  g+='<path d="'+area+'" fill="'+col+'" fill-opacity=".14"/>';
  g+='<path d="'+line+'" fill="none" stroke="'+col+'" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>';
  const ex=X(ti),ey=Y(spent);
  g+='<circle cx="'+ex.toFixed(1)+'" cy="'+ey.toFixed(1)+'" r="4.5" fill="'+col+'" stroke="var(--surface)" stroke-width="2"/>';
  const lx=ex>W-70?ex-8:ex+8,anc=ex>W-70?"end":"start",ly=Math.max(ey-8,T+4);
  g+='<text x="'+lx.toFixed(1)+'" y="'+ly.toFixed(1)+'" text-anchor="'+anc+'" font-size="11" font-weight="700" fill="var(--ink)" font-family="Manrope,sans-serif">'+esc(compactINR(spent))+'</text>';
  const lab=per==="week"?["M","T","W","T","F","S","S"].map((d,i)=>[i,d]):[0,6,13,20,27].filter(i=>i<days).map(i=>[i,String(i+1)]);
  lab.forEach(([i,d])=>{const cx=L+(i+.5)/days*pw;g+='<text x="'+cx.toFixed(1)+'" y="'+(H-7)+'" text-anchor="middle" font-size="10" fill="'+(i===ti?"var(--ink)":"var(--muted)")+'" font-weight="'+(i===ti?700:400)+'" font-family="Inter,sans-serif">'+d+'</text>'});
  return g+'</svg>';
}

async function fxGet(path){const r=await fetch(FX_API+path,{cache:"no-store"});if(!r.ok)throw new Error("rate "+r.status);return r.json()}
async function fxDaily(force){
  if(!S.config||!S.db||S.locked||(!force&&!fxAuto()))return false;
  const curs=fxCurs();if(!curs.length)return false;
  let last=0;try{last=Number(localStorage.getItem("mb.fxTry"))||0}catch(e){}
  if(!force&&Date.now()-last<3*3600e3)return false;
  try{localStorage.setItem("mb.fxTry",String(Date.now()))}catch(e){}
  const c=cfg(),next=Object.assign({},DEFAULT_FX,c.fx||{});let date="",changed=false;
  for(const cur of curs){const j=await fxGet("latest?base="+cur+"&symbols=INR");const v=Number(j&&j.rates&&j.rates.INR);if(!(v>0))throw new Error("no rate");if(Math.abs(v-fx(cur))>=0.005)changed=true;next[cur]=v;date=j.date||date}
  if(!changed&&c.fxSrc==="ecb"&&c.fxDate===date&&c.fxAuto!==false)return false;
  await saveConfig({fx:next,fxSrc:"ecb",fxAt:Date.now(),fxDate:date,fxAuto:true});
  return true;
}
const FX_RANGES={"1M":31,"6M":183,"1Y":366};
async function fxTrend(cur,range){
  const key="mb.fxTrend."+cur+"."+range,day=iso(today());
  try{const c=JSON.parse(localStorage.getItem(key)||"null");if(c&&c.day===day)return c.pts}catch(e){}
  const s=new Date(today());s.setDate(s.getDate()-FX_RANGES[range]);
  const j=await fxGet(iso(s)+".."+day+"?base="+cur+"&symbols=INR");
  const pts=Object.keys(j.rates||{}).sort().map(d=>[d,Number(j.rates[d].INR)]).filter(p=>p[1]>0);
  try{localStorage.setItem(key,JSON.stringify({day,pts}))}catch(e){}
  return pts;
}
function fxChart(pts,cur){
  if(!pts||pts.length<2)return'<p class="hint">Not enough data for this range yet.</p>';
  const all=pts;if(pts.length>70){const st=Math.ceil(pts.length/60);pts=pts.filter((p,i)=>i%st===0||i===pts.length-1)}
  const W=320,H=96,P=4,vs=pts.map(p=>p[1]),lo=Math.min(...vs),hi=Math.max(...vs),span=hi-lo||1;
  const X=i=>P+i/(pts.length-1)*(W-2*P),Y=v=>P+(1-(v-lo)/span)*(H-2*P);
  const line=pts.map((p,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(p[1]).toFixed(1)).join("");
  const av=all.map(p=>p[1]),first=av[0],lastV=av[av.length-1],ch=(lastV-first)/first*100,up=ch>=0;
  const lo2=Math.min(...av),hi2=Math.max(...av),yrs=pts[0][0].slice(0,4)!==pts[pts.length-1][0].slice(0,4);
  const sym=CURS[cur]||cur;
  const lab=d=>{const x=parseISO(d);return x.getDate()+" "+MONTHS[x.getMonth()].slice(0,3)+(yrs?" "+x.getFullYear():"")};
  return '<svg class="fx-svg" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="Rupees per '+esc(sym)+'1 from '+esc(lab(pts[0][0]))+' to '+esc(lab(pts[pts.length-1][0]))+'"><path d="'+line+'L'+X(pts.length-1).toFixed(1)+' '+H+'L'+P+' '+H+'Z" class="fx-area"/><path d="'+line+'" class="fx-line" vector-effect="non-scaling-stroke"/></svg>'+
    '<div class="fx-axis"><span>'+esc(lab(pts[0][0]))+'</span><span>'+esc(lab(pts[pts.length-1][0]))+'</span></div>'+
    '<div class="fx-stats"><span>Low <b class="num">₹'+lo2.toFixed(2)+'</b></span><span>High <b class="num">₹'+hi2.toFixed(2)+'</b></span><span class="'+(up?"up":"down")+'">'+(up?"▲":"▼")+' <b class="num">'+Math.abs(ch).toFixed(1)+'%</b></span></div>';
}
function fxWhen(){const a=cfg().fxAt;if(!a)return"";const d=new Date(a);const t=d.toLocaleTimeString("en-IN",{hour:"numeric",minute:"2-digit"});return shortDay(iso(d))+" "+t}
async function updateRate(){
  if(!S.mcp){toast("Rate updates aren't available in this view.");return}
  if(S.fxBusy)return;
  S.fxBusy=Date.now();S.fxMsg="Fetching the current market rate. This usually takes about a minute.";render();
  try{await S.mcp.callTool("Claude Code Remote","fire_trigger",{trigger_id:FX_TASK},{cache:false})}
  catch(e){
    const c=e&&e.code;
    if(c==="server_unavailable"||c==="upstream_error"){S.fxMsg="Not sure the update started. If the rate hasn't changed in a couple of minutes, tap Update again."}
    else{
      S.fxBusy=0;
      S.fxMsg=c==="not_in_manifest"||c==="approval_required"?"Updating needs your OK. Tap Update again and choose Allow.":
        c==="server_not_connected"||c==="needs_reauth"||c==="selection_required"?"Couldn't reach your Claude account to run the update. Reload the page and try again.":
        c==="blocked_by_policy"?"Your account doesn't allow this. Type the rate in on the Accounts tab instead.":
        c==="tool_error"?"The update couldn't start ("+String((e&&e.message)||"unknown reason").slice(0,140)+"). Type the rate in for now and let Claude know.":
        "Couldn't start the update. Try again in a moment.";
      render();return;
    }
  }
  clearTimeout(S.fxTimer);
  S.fxTimer=setTimeout(()=>{if(S.fxBusy){S.fxBusy=0;S.fxMsg="Still working on it. The new rate will appear here by itself when it's ready.";render()}},180000);
  render();
}

/* ---------- sync: your own Supabase database ---------- */
const APP_VERSION="1.0.7";
const SB_CFG=window.MB_CONFIG||{};
const LS={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
function rid(){const a="abcdefghijklmnopqrstuvwxyz0123456789",r=crypto.getRandomValues(new Uint8Array(20));let s="";for(const x of r)s+=a[x%36];return s}
function deepMerge(a,b){const o=Object.assign({},a);Object.keys(b).forEach(k=>{const v=b[k];if(v&&typeof v==="object"&&!Array.isArray(v)&&o[k]&&typeof o[k]==="object"&&!Array.isArray(o[k]))o[k]=deepMerge(o[k],v);else o[k]=v});return o}
const isNetErr=e=>!navigator.onLine||/fetch|network|load failed|timeout/i.test(String((e&&(e.message||e.details))||e||""));
const COLLS=["config","txns","goals"];
function makeStore(sb,uid){
  const KEY="mb.cache."+uid,OUT="mb.outbox."+uid;
  let data=LS.get(KEY)||{},outbox=LS.get(OUT)||[],live=false,flushing=null;
  const subs=new Set();
  const persist=()=>LS.set(KEY,data),saveOut=()=>LS.set(OUT,outbox);
  const emit=()=>subs.forEach(f=>{try{f()}catch(e){console.error(e)}});
  const put=(c,id,d)=>{data[c]=data[c]||{};if(d===null)delete data[c][id];else data[c][id]=d};
  const pending=(c,id)=>outbox.some(o=>o.coll===c&&o.id===id);
  async function pull(){
    const {data:rows,error}=await sb.from("docs").select("coll,id,data");
    if(error)throw error;
    const fresh={};rows.forEach(r=>{(fresh[r.coll]=fresh[r.coll]||{})[r.id]=r.data});
    outbox.forEach(o=>{fresh[o.coll]=fresh[o.coll]||{};if(o.op==="del")delete fresh[o.coll][o.id];else fresh[o.coll][o.id]=o.data});
    data=fresh;live=true;persist();emit();
  }
  function flush(){
    if(flushing)return flushing;
    if(!outbox.length){syncNote();return Promise.resolve()}
    flushing=run().finally(()=>{flushing=null;syncNote()});
    return flushing;
  }
  async function run(){
    await null;
        while(outbox.length){
          const o=outbox[0];let r;
          try{r=o.op==="del"?await sb.from("docs").delete().match({user_id:uid,coll:o.coll,id:o.id})
            :await sb.from("docs").upsert({user_id:uid,coll:o.coll,id:o.id,data:o.data,updated_at:new Date().toISOString()},{onConflict:"user_id,coll,id"})}
          catch(e){r={error:e}}
          if(r.error){if(isNetErr(r.error))return;outbox.shift();saveOut();throw r.error}
          if(outbox[0]===o){outbox.shift();saveOut()}
        }
  }
  async function write(o){
    put(o.coll,o.id,o.op==="del"?null:o.data);persist();
    outbox=outbox.filter(x=>!(x.coll===o.coll&&x.id===o.id));outbox.push(o);saveOut();emit();
    try{await flush()}catch(e){pull().catch(()=>{});throw{code:"invalid_argument",message:String(e.message||e)}}
  }
  const onRow=r=>{if(!r||!r.coll||pending(r.coll,r.id))return;put(r.coll,r.id,r.data);persist();emit()};
  sb.channel("docs-"+uid)
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"docs",filter:"user_id=eq."+uid},p=>onRow(p.new))
    .on("postgres_changes",{event:"UPDATE",schema:"public",table:"docs",filter:"user_id=eq."+uid},p=>onRow(p.new))
    .on("postgres_changes",{event:"DELETE",schema:"public",table:"docs"},p=>{const o=p.old||{};if(o.user_id===uid&&o.coll&&!pending(o.coll,o.id)){put(o.coll,o.id,null);persist();emit()}})
    .subscribe();
  const snapDoc=(id,d)=>({id,exists:d!==undefined,data:()=>d,metadata:{fromCache:!live,hasPendingWrites:pending}});
  function docRef(c,id){return{id,path:c+"/"+id,
    set:d=>write({op:"set",coll:c,id,data:JSON.parse(JSON.stringify(d))}),
    update:async d=>{const cur=(data[c]||{})[id];if(!cur)throw{code:"invalid_argument",message:"Document not found"};return write({op:"set",coll:c,id,data:deepMerge(cur,JSON.parse(JSON.stringify(d)))})},
    delete:()=>write({op:"del",coll:c,id}),
    onSnapshot(n){const f=()=>n(snapDoc(id,(data[c]||{})[id]));subs.add(f);setTimeout(f,0);return()=>subs.delete(f)}}}
  function col(c){const q={orderBy:()=>q,limit:()=>q,where:()=>q,
    onSnapshot(n){const f=()=>n({docs:Object.entries(data[c]||{}).map(([id,d])=>snapDoc(id,d)),metadata:{fromCache:!live}});subs.add(f);setTimeout(f,0);return()=>subs.delete(f)},
    doc:id=>docRef(c,id||rid()),
    async add(d){const r=docRef(c,rid());await r.set(d);return r}};return q}
  async function importDocs(list){
    for(let i=0;i<list.length;i+=200){
      const rows=list.slice(i,i+200).map(d=>({user_id:uid,coll:d.coll,id:d.id,data:d.data,updated_at:new Date().toISOString()}));
      const {error}=await sb.from("docs").upsert(rows,{onConflict:"user_id,coll,id"});if(error)throw error;
    }
    await pull();
  }
  function exportDocs(){const out=[];COLLS.forEach(c=>Object.entries(data[c]||{}).forEach(([id,d])=>out.push({coll:c,id,data:d})));return out}
  return{collection:col,doc:p=>{const[c,id]=p.split("/");return docRef(c,id)},pull,flush,importDocs,exportDocs,
    isLive:()=>live,hasCache:()=>COLLS.some(c=>data[c]&&Object.keys(data[c]).length),pendingCount:()=>outbox.length,
    clear(){LS.del(KEY);LS.del(OUT)}};
}
function syncNote(){
  if(!S.db)return;
  const n=S.db.pendingCount();
  if(!navigator.onLine)notice("You're offline. Changes are saved on this device and will sync when you're back online."+(n?" ("+n+" waiting)":""));
  else if(!n&&S.db.isLive())notice("");
}

/* ---------- sign in ---------- */
function authShell(inner){
  document.body.classList.add("signed-out");
  const el=$("#authView");el.hidden=false;
  el.innerHTML='<div class="auth-card card"><div class="brand" style="margin-bottom:6px"><div class="brand-mark" aria-hidden="true">₹</div>My Budget</div>'+inner+'</div>';
  return el;
}
function showSetup(){
  authShell('<h2 class="h-view" style="font-size:19px">Almost ready</h2><p class="muted">This copy isn\'t connected to your database yet. Add your Supabase URL and key to <b>config.js</b>, then reload.</p>');
}
function showLogin(msg){
  let mode="in";
  function paint(){
    const el=authShell('<h2 class="h-view" style="font-size:19px">'+(mode==="in"?"Sign in":"Create your account")+'</h2>'+
      '<p class="muted" style="margin:4px 0 14px">'+(mode==="in"?"Your data syncs between your iPhone and Mac.":"Use an email and password only you know. This account holds your money data.")+'</p>'+
      '<form id="authForm" autocomplete="on"><label class="f-label" for="auE">Email</label><input class="field" id="auE" type="email" autocomplete="email" inputmode="email" required>'+
      '<label class="f-label" for="auP">Password</label><input class="field" id="auP" type="password" autocomplete="'+(mode==="in"?"current-password":"new-password")+'" minlength="8" required>'+
      '<div class="err" id="auErr" role="alert">'+esc(msg||"")+'</div><div class="actions"><button class="btn" id="auGo" type="submit" style="flex:1">'+(mode==="in"?"Sign in":"Create account")+'</button></div></form>'+
      '<p class="hint" style="text-align:center;margin-top:14px"><button class="link" id="auMode" type="button">'+(mode==="in"?"First time? Create your account":"Already have an account? Sign in")+'</button></p>');
    $("#auMode").addEventListener("click",()=>{mode=mode==="in"?"up":"in";msg="";paint()});
    $("#authForm").addEventListener("submit",async e=>{
      e.preventDefault();const em=$("#auE").value.trim(),pw=$("#auP").value,err=$("#auErr"),b=$("#auGo");
      if(pw.length<8){err.textContent="Use at least 8 characters for the password.";return}
      b.disabled=true;err.textContent="";
      try{
        const r=mode==="in"?await S.sb.auth.signInWithPassword({email:em,password:pw}):await S.sb.auth.signUp({email:em,password:pw});
        if(r.error)throw r.error;
        if(mode==="up"&&!r.data.session){mode="in";msg="";paint();$("#auErr").style.color="var(--good)";$("#auErr").textContent="Account created. Check your email to confirm it, then sign in here.";return}
      }catch(x){b.disabled=false;const m=String(x.message||x);err.textContent=/invalid login/i.test(m)?"That email and password don't match.":/not confirmed/i.test(m)?"Confirm your email first (check your inbox), then sign in.":/signups not allowed|disabled/i.test(m)?"New accounts are turned off for this app.":isNetErr(x)?"Can't reach the server. Check your connection.":m}
    });
  }
  paint();
}
function hideAuth(){document.body.classList.remove("signed-out");const el=$("#authView");el.hidden=true;el.innerHTML=""}

/* ---------- backup ---------- */
function dataCard(){
  const em=S.user&&S.user.email||"";
  return '<div class="card"><div class="card-h"><h3 class="card-t">Sync &amp; backup</h3></div>'+
    '<p class="hint" style="margin-top:0">Signed in as <b>'+esc(em)+'</b>. Changes sync to your other devices automatically.</p>'+
    '<div class="actions" style="margin-top:12px"><button class="btn ghost sm" id="bkExp">Download backup</button><label class="btn ghost sm" for="bkImp" style="cursor:pointer">Import backup</label><input type="file" id="bkImp" accept=".json,application/json" hidden></div>'+
    '<div id="bkBox"></div><p class="hint" style="margin-top:14px"><button class="link" id="signOut">Sign out</button> <span class="muted">· version '+esc(APP_VERSION)+'</span></p></div>';
}
function wireDataCard(el){
  const ex=el.querySelector("#bkExp");if(!ex)return;
  ex.addEventListener("click",async()=>{
    const json=JSON.stringify({app:"my-budget",exported:iso(today()),docs:S.db.exportDocs()},null,1);
    const name="my-budget-backup-"+iso(today())+".json",file=new File([json],name,{type:"application/json"});
    try{if(navigator.canShare&&navigator.canShare({files:[file]})&&/iphone|ipad|android/i.test(navigator.userAgent)){await navigator.share({files:[file],title:name});return}}catch(e){if(e&&e.name==="AbortError")return}
    const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
  });
  el.querySelector("#bkImp").addEventListener("change",async e=>{
    const f=e.target.files&&e.target.files[0],box=el.querySelector("#bkBox");e.target.value="";if(!f)return;
    let docs;
    try{const j=JSON.parse(await f.text());docs=(j.docs||[]).filter(d=>d&&COLLS.includes(d.coll)&&typeof d.id==="string"&&d.id.length&&d.id.length<200&&d.data&&typeof d.data==="object"&&!Array.isArray(d.data));if(!docs.length)throw 0}
    catch(x){box.innerHTML='<p class="err">That file isn\'t a My Budget backup.</p>';return}
    const n=c=>docs.filter(d=>d.coll===c).length;
    box.innerHTML='<div class="g-plan" style="margin-top:12px">Import '+n("txns")+' entries, '+n("goals")+' plans'+(n("config")?' and your accounts, budgets and categories':'')+'? Anything with the same ID is replaced.<div class="actions" style="margin-top:10px"><button class="btn sm" id="bkGo">Import</button><button class="btn ghost sm" id="bkNo">Cancel</button></div></div>';
    box.querySelector("#bkNo").addEventListener("click",()=>{box.innerHTML=""});
    box.querySelector("#bkGo").addEventListener("click",async ev=>{ev.target.disabled=true;try{await S.db.importDocs(docs);box.innerHTML="";S.aDraft=null;toast("Backup imported")}catch(x){ev.target.disabled=false;box.insertAdjacentHTML("beforeend",'<p class="err">'+esc(isNetErr(x)?"Can't reach the server. Try again when you're online.":String(x.message||x))+'</p>')}});
  });
  el.querySelector("#signOut").addEventListener("click",async ev=>{
    const b=ev.target;if(!b.dataset.armed){b.dataset.armed="1";b.textContent="Tap again to sign out";return}
    if(S.db&&S.db.pendingCount()&&!b.dataset.ok){b.dataset.ok="1";b.textContent="Some changes haven't synced yet. Tap again to sign out anyway";return}
    try{S.db&&S.db.clear()}catch(e){}
    await S.sb.auth.signOut().catch(()=>{});location.reload();
  });
}

/* ---------- updates ---------- */
async function checkUpdate(){
  try{const r=await fetch("version.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)return;const j=await r.json();
    if(j&&j.v&&j.v!==APP_VERSION&&!document.getElementById("updBar")){const b=document.createElement("button");b.id="updBar";b.className="upd";b.textContent="Update ready · tap to reload";b.addEventListener("click",()=>location.reload());document.body.appendChild(b)}}catch(e){}
}

/* ---------- start ---------- */
async function boot(){
  const h=location.hash.slice(1);if(VIEWS.includes(h))setView(h,false);else render();
  if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
  if(!window.supabase||!SB_CFG.url||!SB_CFG.key||/YOUR_/.test(SB_CFG.url+SB_CFG.key)){showSetup();return}
  S.sb=window.supabase.createClient(SB_CFG.url,SB_CFG.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  let session=null;try{session=(await S.sb.auth.getSession()).data.session}catch(e){}
  if(session)start(session);else showLogin();
  S.sb.auth.onAuthStateChange((ev,sess)=>{if(sess&&!S.db&&(ev==="SIGNED_IN"||ev==="INITIAL_SESSION"))start(sess);if(ev==="SIGNED_OUT"&&S.db)location.reload()});
  checkUpdate();
}
function start(session){
  if(S.db)return;
  hideAuth();S.user=session.user;
  const db=makeStore(S.sb,session.user.id);S.db=db;S.sample=null;S.mcp=null;
  const editing=()=>!!document.querySelector("#view-budgets:not([hidden]) input:focus, #view-accounts:not([hidden]) input:focus");
  db.collection("txns").onSnapshot(snap=>{
    S.txns=snap.docs.map(d=>norm(Object.assign({id:d.id},d.data())));
    S.txSeen=db.isLive()||db.hasCache();S.txLive=db.isLive();
    if(!editing())render();
  });
  db.collection("goals").onSnapshot(snap=>{S.goals=snap.docs.map(d=>Object.assign({id:d.id},d.data()));S.goalsSeen=true;if(!editing())render()});
  db.doc("config/main").onSnapshot(snap=>{S.config=snap.exists?snap.data():null;if(!S.bDirty&&!S.aDirty&&!editing())render()});
  const refresh=()=>{db.flush().catch(e=>toast(errText(e))).finally(()=>db.pull().then(()=>{syncNote();fxDaily().catch(()=>{})}).catch(e=>{if(!db.hasCache()&&!isNetErr(e))notice("Couldn't load your data: "+(e.message||e));else syncNote()}))};
  refresh();
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){refresh();checkUpdate()}});
  addEventListener("online",refresh);addEventListener("offline",syncNote);
  setInterval(checkUpdate,30*60*1000);
}
boot();
})();
